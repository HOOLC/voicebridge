version: 1

voice:
  tts_resource_id: "seed-tts-2.0"
  tts_speaker: "zh_female_vv_uranus_bigtts"
  format: "wav"
  sample_rate: 24000
  speed_ratio: 1.05
  volume_ratio: 1.0
  pitch_ratio: 1.0

ack:
  default: "收到啦"
  variants:
    - "收到啦"
    - "好呀，收到"
    - "嗯嗯，收到"
    - "在呢，收到啦"

interaction:
  interrupt_playback: true
  cancel_codex_on_interrupt: false
  vad_rms_threshold: 900

commands:
  transcript_min_chars: 2
  ignore_phrases:
    - "嗯"
    - "啊"
    - "呃"
    - "额"
    - "哦"
    - "喂"
  repeat_aliases:
    - "再说一遍"
    - "再说一次"
    - "重复一下"
    - "把刚才说的再说一遍"
    - "刚才说什么"
  stop_aliases:
    - "停一下"
    - "别说了"
    - "先别说"
    - "闭嘴"

schedule:
  check_interval_seconds: 15